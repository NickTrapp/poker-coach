[project]
name = "poker-coach"
version = "0.1.0"
description = "An AI-native no-limit hold'em poker coaching system."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The real model clients. Both optional, so the deterministic layers, the CLI
# and the whole test suite work without either one.
anthropic = [
    "anthropic>=0.40",
]
gemini = [
    "google-genai>=1.0",
]

[project.scripts]
poker-coach = "poker_coach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
