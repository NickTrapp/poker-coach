name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The default job installs NO optional extras. That is the point: the
  # deterministic layers, the CLI and the whole suite must work without either
  # provider SDK, and a green run here is the proof.
  tests:
    name: tests (no provider SDKs)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev extras only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert neither provider SDK is installed
        run: |
          python - <<'PY'
          import importlib.util, sys

          def installed(name: str) -> bool:
              # find_spec RAISES rather than returning None when a parent
              # package is absent, so "google.genai" explodes on a clean box.
              try:
                  return importlib.util.find_spec(name) is not None
              except ModuleNotFoundError:
                  return False

          present = [n for n in ("anthropic", "google.genai") if installed(n)]
          if present:
              sys.exit(f"optional SDKs leaked into the base install: {present}")
          print("confirmed: no provider SDK installed")
          PY

      - name: Import the package without any SDK
        run: |
          python -c "
          import poker_coach
          from poker_coach.models import AnthropicModel, GeminiModel
          print('imports fine without either SDK:', poker_coach.__version__)
          "

      - name: Run the test suite
        run: pytest -q

      # Exercises the installed console script, not the source tree. A green
      # unit suite says nothing about whether a package made it into the
      # commit: `practice/` in .gitignore once matched src/poker_coach/practice
      # at any depth, so the CLI shipped importing a module that was never
      # committed, and every test still passed because the tests were missing
      # too.
      - name: Smoke-test the installed CLI
        run: |
          set -e
          poker-coach --help > /dev/null
          printf 'f\nf\nf\nf\n' | poker-coach practice \
            --hands 1 --provider none --seed 1 --iterations 200 --log-dir ''
          poker-coach eval AsKsQsJsTs2h3d
          poker-coach review examples/hands/thin-river-call.json --replay > /dev/null

      - name: Every package under src/ must be importable from the install
        run: |
          cd /tmp   # not the source tree, so only the installed copy counts
          python - <<'PY'
          import importlib, pkgutil, sys
          import poker_coach

          missing = []
          for info in pkgutil.walk_packages(
              poker_coach.__path__, prefix="poker_coach."
          ):
              try:
                  importlib.import_module(info.name)
              except ImportError as exc:  # optional SDKs are allowed to be absent
                  if "pip install" not in str(exc):
                      missing.append(f"{info.name}: {exc}")
          if missing:
              sys.exit("modules failed to import:\n  " + "\n  ".join(missing))
          print("every module imports from the installed package")
          PY

  # A second install *with* both SDKs, so the client tests actually execute
  # instead of skipping. The Gemini request-shape tests build real
  # google.genai types, so an SDK change fails here rather than in production.
  tests-with-providers:
    name: tests (with provider SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anthropic,gemini]"

      - name: Run the test suite
        run: pytest -q

      - name: Confirm the provider tests ran rather than skipped
        run: pytest tests/models -q --no-header -rs

  # The two ground-truth checks the unit suite is too slow to carry. They are
  # what establish that the evaluator and sampler are correct rather than
  # merely self-consistent.
  verify-math:
    name: ground-truth math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev extras only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enumerate all 2,598,960 hands and check the sampler
        run: python scripts/verify_math.py

  # Simulated play only breaks in volume — the last two rounds of bugs were
  # found at 1200+ hands, not by any single-hand test.
  simulated-hands:
    name: simulated hands (volume)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev extras only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Play 600 hands across 2-6 seats with mixed stacks
        run: python scripts/stress_hands.py --hands 600
